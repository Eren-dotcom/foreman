<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="ChunkPod state machine derived from the compiled artifact">
  <defs>
    <marker id="head-3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="head-f7931a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f7931a"/></marker>
    <marker id="head-f85149" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="head-8b949e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="900" height="320" fill="#0b1016"/>
  
  <rect x="40" y="118" width="190" height="78" rx="12" fill="#12181f" stroke="#242c37" stroke-width="1.5"/>
  <text x="135" y="148" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#e6edf3">FRESH</text>
  <text x="135" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#8b949e">client computes the pod address</text>
  
  <rect x="330" y="96" width="240" height="122" rx="12" fill="#1a2013" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#e6edf3">FUNDED</text>
  <text x="450" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#8b949e">one coin holds the whole budget</text>
  
  <rect x="670" y="118" width="190" height="78" rx="12" fill="#12181f" stroke="#242c37" stroke-width="1.5"/>
  <text x="765" y="148" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#e6edf3">CLOSED</text>
  <text x="765" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#8b949e">nothing left to spend</text>

  <path id="p-fund" d="M230,157 L330,157" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#head-3fb950)"/>
  <text x="280" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3fb950">fund()</text>

  <path id="p-deliver" d="M470,96 C470,40 400,40 400,96" fill="none" stroke="#f7931a" stroke-width="1.6" marker-end="url(#head-f7931a)"/>
  <text x="452" y="34" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#f7931a">deliver() · provider · whole chunks ≤ window</text>

  <path id="p-refund" d="M570,150 C640,150 640,157 670,157" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#head-8b949e)"/>
  <text x="621" y="140" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">refund() · after expiry</text>

  <path id="p-close" d="M470,218 C470,270 400,270 400,218" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#head-3fb950)" transform="translate(0,0)"/>
  <path d="M545,218 C640,275 640,200 668,175" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#head-3fb950)"/>
  <text x="604" y="252" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#3fb950">close() · both keys</text>

  <text x="40" y="40" font-family="ui-monospace,monospace" font-size="12" fill="#8b949e">derived from artifacts/ChunkPod.json · ChunkPod · 3 spend paths · 930 bytes</text>
  <text x="40" y="60" font-family="system-ui,sans-serif" font-size="11.5" fill="#55606b">every arrow is a real function in the ABI; if the contract gains a path, this diagram fails to build rather than lie</text>

  <g font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">
    <text x="40" y="292">deliver: provider pays itself, remainder stays in the pod — the pod is its own state.</text>
    <text x="40" y="308">refund: needs tx.time ≥ validUntil. close: needs both keys, no expiry.</text>
  </g>
